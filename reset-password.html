<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - KRISHTECH</title>
  <meta name="description" content="Enter your OTP code and set your new account password.">
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="krish-icon.svg">
  <link rel="apple-touch-icon" href="krish-icon.svg">
  <meta name="theme-color" content="#4f46e5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <link rel="stylesheet" href="style.css">
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div id="toast-container" class="toast-container"></div>

  <div class="auth-wrapper">
    <div class="auth-container">
      <div class="auth-logo-area" style="text-align: center; margin-bottom: 1.5rem;">
        <img src="krish-logo.svg" alt="KRISHTECH" style="max-height: 56px; width: auto; margin: 0 auto; display: block;" onerror="this.style.display='none'; document.getElementById('main-logo-heading').style.display='block';">
        <h1 class="auth-logo" id="main-logo-heading" style="display: none; font-size: 1.5rem; font-weight: 800;">
          KRISH<span style="color: var(--primary);">TECH</span>
        </h1>
      </div>
      
      <div class="card panel-glass auth-card">
        <h2 class="auth-title">Reset Your Password</h2>
        <p class="auth-subtitle">Verify with the 6-digit OTP code sent to your email</p>

        <form id="direct-reset-form" novalidate>
          <div class="form-group">
            <label for="reset-email" class="form-label">Email Address</label>
            <input type="email" id="reset-email" class="form-input" placeholder="e.g. name@example.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <label for="reset-otp" class="form-label">6-Digit Verification Code</label>
              <button type="button" id="request-otp-inline-btn" class="btn-link" style="font-size: 0.8rem;">
                Send OTP Code
              </button>
            </div>
            <input type="text" id="reset-otp" class="form-input" placeholder="Enter 6-digit OTP" maxlength="6" inputmode="numeric" style="letter-spacing: 4px; font-weight: 700; font-family: monospace;" required>
          </div>

          <div class="form-group">
            <label for="reset-new-password" class="form-label">New Password</label>
            <div class="password-field-wrapper">
              <input type="password" id="reset-new-password" class="form-input" placeholder="Min. 6 characters" required autocomplete="new-password">
              <button type="button" class="password-toggle-btn" data-target="reset-new-password">
                <i data-lucide="eye"></i>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="reset-confirm-password" class="form-label">Confirm New Password</label>
            <div class="password-field-wrapper">
              <input type="password" id="reset-confirm-password" class="form-input" placeholder="Re-enter new password" required autocomplete="new-password">
              <button type="button" class="password-toggle-btn" data-target="reset-confirm-password">
                <i data-lucide="eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" id="reset-submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 1.25rem;">
            <i data-lucide="shield-check"></i>
            <span>Reset &amp; Save Password</span>
          </button>
        </form>

        <div class="auth-actions" style="margin-top: 1.25rem;">
          <a href="forgot.html" class="btn btn-secondary">
            <i data-lucide="help-circle"></i> Need an OTP? Go to Forgot Wizard
          </a>
          <a href="index.html" class="btn btn-secondary">
            <i data-lucide="arrow-left"></i> Back To Login
          </a>
        </div>
      </div>
      
      <div class="auth-footer">
        <p>© 2026 KRISHTECH &bull; Money Manager Pro</p>
      </div>
    </div>
  </div>

  <!-- EmailJS SDK Core -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="email-service.js"></script>
  <script src="firebase.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
